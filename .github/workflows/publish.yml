# Publish to npm when a version tag is pushed.
#
# Trusted publishing rather than a token: npm is restricting tokens that bypass
# 2FA — account changes from August 2026, direct publishing from January 2027 —
# and OIDC has no secret to leak in the first place.
#
# One ordering constraint, which is not obvious: a trusted publisher is
# configured on a *package's* settings page, so the package has to exist before
# it can be set up. The first release is therefore a manual `npm publish`; every
# release after it runs from here. See "Releasing" in the README.
#
#   npm version patch   # or minor / major — this writes the tag
#   git push --follow-tags
#
# `npm publish` runs prepublishOnly, which typechecks, builds and tests, so a
# release that would not have worked never reaches the registry.

name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for trusted publishing and for the provenance attestation.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # No `environment:` on purpose. The trusted publisher's optional environment
    # field has to match this exactly, and an empty one is one fewer thing to get
    # wrong on a first release. Add a protected environment here and on npmjs.com
    # together, later, if releases ever need an approval step.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # The tag and the version in package.json disagreeing is the one release
      # mistake that is invisible until someone installs the wrong thing.
      - name: The tag, package.json and server.json must all agree
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          declared="$(node -p "require('./server.json').version")"
          pinned="$(node -p "require('./server.json').packages[0].version")"
          if [ "$tagged" != "$packaged" ] || [ "$declared" != "$packaged" ] || [ "$pinned" != "$packaged" ]; then
            echo "Version disagreement — tag $tagged, package.json $packaged, server.json $declared, package pin $pinned" >&2
            exit 1
          fi

      - run: npm publish --provenance --access public

      # ------------------------------------------------- the MCP registry
      #
      # Metadata only: the registry points at the npm package rather than
      # hosting anything, which is why this runs after the publish above and
      # why package.json carries `mcpName`. That field is the proof the npm
      # package and this server name belong to the same person, and it is only
      # checked inside a published tarball — so a registry publish can never
      # run ahead of the npm one.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # No secret: the same id-token permission that gives npm its provenance
      # proves this repository owns the io.github.arimunandar namespace.
      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP registry
        run: ./mcp-publisher publish
