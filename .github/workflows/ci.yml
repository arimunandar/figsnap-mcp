# Build, typecheck and test on every push and pull request.
#
# The suites need no network and no Figma: each starts whatever daemon it wants
# on a free port of its own, and the plugin runs against a stand-in for the
# `figma` API. So this is the same command a contributor runs locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The lowest Node the package claims to support, and current. A daemon
        # people leave running all day is worth checking on both.
        node: ['20', '22', '24']
        os: [ubuntu-latest]
        include:
          - node: '22'
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      # What would actually be sent to the registry, checked on one job rather
      # than four. e2e-package.mjs asserts the contents; this proves it packs.
      - name: Pack
        if: matrix.node == '22' && matrix.os == 'ubuntu-latest'
        run: npm pack --dry-run
